<!DOCTYPE html>
<html>
<head>
    <title>Пользователи</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>👥 Пользователи</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Имя</th>
            <th>Зарегистрирован</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.telegram_id }}</td>
            <td>{{ user.username or '-' }}</td>
            <td>{{ user.first_name or '-' }}</td>
            <td>{{ user.registered_at or '-' }}</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="/">Назад</a></p>
</body>
</html>
